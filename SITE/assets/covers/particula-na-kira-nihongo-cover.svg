<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Partícula な em Kira Nihongo</title>
  <desc id="desc">Capa clara e didática com exemplos de adjetivos-na em japonês.</desc>
  <defs>
